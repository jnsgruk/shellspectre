{% if paginated.has_next %}
<div id="load-more-sentinel"
    data-on-intersect__once="@get('{{ nav.page_url(paginated.page + 1) }}&append=true')"
    class="py-8 text-center"
    data-show="!$_live"
>
    <span class="text-xs text-gray-600 tracking-wide uppercase">Loading more&hellip;</span>
</div>
{% else %}
<div id="load-more-sentinel" class="py-6 text-center" data-show="!$_live">
    {% if paginated.total_items > 0 %}
    <span class="text-xs text-gray-600 tracking-wide">{{ paginated.total_items }} events</span>
    {% endif %}
</div>
{% endif %}
