#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "builtin"
hooks = [
    { id = "trailing-whitespace" },
    { id = "end-of-file-fixer" },
    { id = "check-added-large-files" },
]

[[repos]]
repo = "local"
hooks = [
    {
        id = "fmt-check",
        name = "cargo fmt --check",
        entry = "mise run fmt-check",
        language = "system",
        pass_filenames = false,
        types = ["rust"],
    },
    {
        id = "clippy",
        name = "cargo clippy",
        entry = "mise run clippy",
        language = "system",
        pass_filenames = false,
        types = ["rust"],
    },

]
