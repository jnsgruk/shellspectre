[package]
name = "shspectr-system-tests"
version = "0.1.0"
edition = "2024"
publish = false

[lints]
workspace = true

[dependencies]
anyhow = "1"
openssh = "0.11"
tokio = { version = "1", features = ["full"] }
rand = "0.9"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.35", features = ["bundled"] }
