[package]
name = "oxilog-ebpf"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "oxilog-ebpf"
path = "src/main.rs"

[dependencies]
oxilog-common = { path = "../oxilog-common", default-features = false }
aya-ebpf = "0.1.1"
aya-log-ebpf = "0.1.0"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

# eBPF: casts are intentional and unavoidable
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
doc_markdown = "allow"

# Restriction: high-value
undocumented_unsafe_blocks = "warn"
dbg_macro = "warn"
missing_assert_message = "warn"

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[profile.dev]
opt-level = 2
overflow-checks = false
debug-assertions = false

[profile.release]
lto = true
panic = "abort"
