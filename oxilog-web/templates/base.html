<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}oxilog{% endblock %}</title>
    <style>{{ styles|safe }}</style>
    <style>
        /* Tokyo Night Dark — Base16-style ANSI palette for IO panel */
        .ansi-pre {
            --ansi-black:          #1a1b26;
            --ansi-red:            #f7768e;
            --ansi-green:          #9ece6a;
            --ansi-yellow:         #e0af68;
            --ansi-blue:           #7aa2f7;
            --ansi-magenta:        #bb9af7;
            --ansi-cyan:           #7dcfff;
            --ansi-white:          #a9b1d6;
            --ansi-bright-black:   #414868;
            --ansi-bright-red:     #f7768e;
            --ansi-bright-green:   #9ece6a;
            --ansi-bright-yellow:  #e0af68;
            --ansi-bright-blue:    #7aa2f7;
            --ansi-bright-magenta: #bb9af7;
            --ansi-bright-cyan:    #7dcfff;
            --ansi-bright-white:   #c0caf5;
        }

        /* Subtle scrollbars */
        ::-webkit-scrollbar              { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track        { background: transparent; }
        ::-webkit-scrollbar-thumb        { background: #374151; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover  { background: #4b5563; }
        * { scrollbar-width: thin; scrollbar-color: #374151 transparent; }
    </style>
    <script type="module" src="https://cdn.jsdelivr.net/gh/starfederation/datastar@v1.0.1/bundles/datastar.js"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">
    <header class="border-b border-gray-800 px-6 py-4">
        <div class="flex items-center justify-between max-w-7xl mx-auto">
            <h1 class="text-xl font-mono font-bold tracking-tight">oxilog</h1>
            <div class="text-sm text-gray-400">session recorder</div>
        </div>
    </header>
    <main class="max-w-7xl mx-auto px-6 py-8">
        {% block content %}{% endblock %}
    </main>
<script>
// Cap live tail rows at 500 to prevent unbounded DOM growth.
const MAX_ROWS = 500;
const observer = new MutationObserver(() => {
    const tbody = document.getElementById('event-rows');
    if (!tbody) return;
    // Each event = 2 <tr> elements (row + detail placeholder)
    while (tbody.children.length > MAX_ROWS * 2) {
        tbody.removeChild(tbody.lastElementChild);
        tbody.removeChild(tbody.lastElementChild);
    }
});
document.addEventListener('DOMContentLoaded', () => {
    const tbody = document.getElementById('event-rows');
    if (tbody) observer.observe(tbody, { childList: true });
});
</script>
</body>
</html>
