{% extends "base.html" %}

{% block title %}oxilog — {{ status_code }}{% endblock %}

{% block content %}
<div class="flex flex-col items-center justify-center py-24">
    <div class="text-6xl font-mono font-bold text-gray-600 mb-4">{{ status_code }}</div>
    <div class="text-lg text-gray-400 mb-2">{{ title }}</div>
    <div class="text-sm text-gray-500 mb-8">{{ message }}</div>
    <a href="/" class="px-4 py-2 rounded bg-gray-800 hover:bg-gray-700 text-gray-300 text-sm">
        ← Back to events
    </a>
</div>
{% endblock %}
